<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Lattice — loading</title>
  <style>
    .dot { fill:#6875f5; opacity:.25; animation: dot 1.6s ease-in-out infinite; }
    .bar { transform-box: fill-box; transform-origin: 50% 50%; animation: eq 1.1s ease-in-out infinite; }
    .b1 { animation-delay: -0.35s } .b2 { animation-delay: 0s } .b3 { animation-delay: -0.7s }
    .d1{animation-delay:0s}.d2{animation-delay:.12s}.d3{animation-delay:.24s}.d4{animation-delay:.36s}.d5{animation-delay:.48s}.d6{animation-delay:.6s}
    @keyframes eq { 0%,100% { transform: scaleY(.45) } 50% { transform: scaleY(1) } }
    @keyframes dot { 0%,100% { opacity:.18 } 40% { opacity:.75 } }
    @media (prefers-reduced-motion: reduce) { .bar,.dot { animation: none } .dot { opacity:.4 } }
  </style>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#101013"/>
  <circle class="dot d1" cx="156" cy="132" r="22"/><circle class="dot d2" cx="256" cy="132" r="22"/><circle class="dot d3" cx="356" cy="132" r="22"/>
  <circle class="dot d6" cx="156" cy="380" r="22"/><circle class="dot d5" cx="256" cy="380" r="22"/><circle class="dot d4" cx="356" cy="380" r="22"/>
  <rect class="bar b1" x="134" y="196" width="44" height="120" rx="22" fill="#6875f5"/>
  <rect class="bar b2" x="234" y="176" width="44" height="160" rx="22" fill="#eef0ff"/>
  <rect class="bar b3" x="334" y="186" width="44" height="140" rx="22" fill="#6875f5"/>
</svg>
